replicaCount: 1

image:
  repository: ghcr.io/nutanix-cloud-native/ndb-operator/controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resources:
  controller:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
