name: Linting Charts

on:
  push:
    paths:
      - 'deploy/helm/**'

jobs:
  check-helm-only:
    runs-on: ubuntu-latest
    outputs:
      helm-only: ${{ steps.check.outputs.helm-only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check if only helm files changed
        id: check
        run: |
          changed_files=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$changed_files"
          non_helm=$(echo "$changed_files" | grep -v '^deploy/helm/' || true)
          if [ -z "$non_helm" ]; then
            echo "helm-only=true" >> $GITHUB_OUTPUT
            echo "Only helm files changed - running helm jobs"
          else
            echo "helm-only=false" >> $GITHUB_OUTPUT
            echo "Non-helm files also changed - skipping helm jobs"
          fi

  linting:
    needs: check-helm-only
    if: needs.check-helm-only.outputs.helm-only == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml --target-branch main)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml --target-branch main

      - name: ArtifactHUB Lint
        env:
          AH_CLI_VERSION: 1.6.0
        run: |
          curl -LO https://github.com/artifacthub/hub/releases/download/v${AH_CLI_VERSION}/ah_${AH_CLI_VERSION}_linux_amd64.tar.gz
          tar xvzf ah_${AH_CLI_VERSION}_linux_amd64.tar.gz
          ./ah lint deploy/helm
          