apiVersion: ndb.nutanix.com/v1alpha1
kind: Database
metadata:
  name: clone-mssql-si
spec:
  ndbRef: clone-ndb-mssql-si
  isClone: true
  clone:
    name: clone-mssql-si
    type: mssql
    description: Cloning mssql single instance testing 
    # clusterId: ""  # Alternative: use UUID instead of name
    clusterName: ""  # Set by test framework from NX_CLUSTER_NAME_ENV
    profiles: 
      software:
        name: MSSQL-MAZIN2
    credentialSecret: clone-db-secret-mssql-si
    timezone: UTC
    # sourceDatabaseId: ""  # Alternative: use UUID instead of name
    sourceDatabaseName: ""  # Set by test framework from MSSQL_SI_CLONING_NAME_ENV
    # snapshotId: ""  # Alternative: use specific snapshot UUID
    snapshotName: ""  # Optional: use specific snapshot name, or leave empty for auto-selection
    additionalArguments:
      "authentication_mode": "mixed"
    