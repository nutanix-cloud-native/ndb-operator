apiVersion: ndb.nutanix.com/v1alpha1
kind: Database
metadata:
  name: clone-mongo-si
spec:
  ndbRef: clone-ndb-mongo-si
  isClone: true
  clone:
    name: clone-mongo-si
    type: "mongodb"
    description: Cloning mongoDB single instance testing 
    # clusterId: ""  # Alternative: use UUID instead of name
    clusterName: ""  # Set by test framework from NX_CLUSTER_NAME_ENV
    profiles: {}
    credentialSecret: clone-db-secret-mongo-si
    timezone: America/Los_Angeles
    # sourceDatabaseId: ""  # Alternative: use UUID instead of name
    sourceDatabaseName: ""  # Set by test framework from MONGO_SI_CLONING_NAME_ENV
    # snapshotId: ""  # Alternative: use specific snapshot UUID
    snapshotName: ""  # Optional: use specific snapshot name, or leave empty for auto-selection
    additionalArguments: {}
