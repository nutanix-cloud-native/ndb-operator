apiVersion: ndb.nutanix.com/v1alpha1
kind: Database
metadata:
  name: db-mssql-si
spec:
  ndbRef: ndb-mssql
  databaseInstance:
    name: db-mssql-si
    databaseNames:
      - database_one
    # clusterId: <cluster-id>
    clusterName: <cluster-name>  # Optional: use clusterName instead of clusterId
    credentialSecret: db-secret-mssql-si
    size: 10
    timezone: "UTC"
    type: mssql
    profiles:
      dbParam:
        name: "DEFAULT_SQLSERVER_DATABASE_PARAMS"
      dbParamInstance:
        name: "DEFAULT_SQLSERVER_INSTANCE_PARAMS"
    timeMachine:
      name: db-mssql-si_TM
      description: "TM provisioned by operator"
      sla : "DEFAULT_OOB_GOLD_SLA"
      dailySnapshotTime:   "12:34:56"
      snapshotsPerDay:     4           
      logCatchUpFrequency: 90           
      weeklySnapshotDay:   "WEDNESDAY"  
      monthlySnapshotDay:  24           
      quarterlySnapshotMonth: "Jan"     
    additionalArguments:
      authentication_mode: "mixed"
      sql_user_password: "Nutanix.1"
