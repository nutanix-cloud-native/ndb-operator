apiVersion: ndb.nutanix.com/v1alpha1
kind: Database
metadata:
  name: db-pg-si
spec:
  ndbRef: ndb-pg
  databaseInstance:
    Name: db-pg-si
    databaseNames:
      - database_one
      - database_two
      - database_three
    # clusterId: <cluster-id>
    clusterName: <cluster-name>  # Optional: use clusterName instead of clusterId
    credentialSecret: db-secret-pg-si
    size: 10
    timezone: "UTC"
    type: postgres
    profiles:
      network:
        name: "PGSI_ntwk_profile"
    timeMachine:
      name: db-pg-si_TM
      description: "TM provisioned by operator"
      sla : "DEFAULT_OOB_GOLD_SLA"
      dailySnapshotTime:   "12:34:56"  
      snapshotsPerDay:     4          
      logCatchUpFrequency: 90           
      weeklySnapshotDay:   "WEDNESDAY"  
      monthlySnapshotDay:  24          
      quarterlySnapshotMonth: "Jan"  
    additionalArguments: {}
